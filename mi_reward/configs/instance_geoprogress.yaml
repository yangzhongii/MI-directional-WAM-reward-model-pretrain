# Rigid-task data-preparation configuration. Stage 1 uses this YAML; Stage 2
# (LaWAM features, MI preferences, and reward SFT) reads the resulting manifest.
task_suite: rigid_v1
task_family: pick_place
task_families: [pick_place, push_shape, peg_insertion]

data_preparation:
  environment_root: .venv
  python: .venv/bin/python
  headless: true
  mujoco:
    backend: mujoco
    gl_backend: egl
    asset_catalog_version: rigid_v1
  sam3:
    source_root: .venv/src/sam3
    checkpoint_root: .venv/models/sam3
  cosmos:
    source_root: .venv/src/cosmos-predict2.5
    predict_checkpoint_root: .venv/models/cosmos-predict2.5
    transfer_checkpoint_root: .venv/models/cosmos-transfer2.5
    predict_model: 2B/robot/action-cond
    transfer_model: Cosmos-Transfer2.5-2B

paths:
  candidate_records: dataset/mi_reward/instance_rollouts/rigid_v1_records.jsonl
  manifest: dataset/mi_reward/manifests/instance_rigid_v1.jsonl
  success_refs: dataset/mi_reward/manifests/instance_rigid_v1_success_refs.jsonl
  feature_root: dataset/mi_reward/geoprogress_features/instance_rigid_v1
  preferences: dataset/mi_reward/preferences/instance_rigid_v1.jsonl
  output_dir: results/mi_reward/instance_rigid_v1
  feasibility_config: mi_reward/configs/feasibility_rigid.json
  run_report: results/mi_reward/instance_rigid_v1/run_report.json

verification:
  max_pose_step: 0.25
  require_controls: true

generation:
  num_candidates: 8
  predict_model: 2B/robot/action-cond
  transfer_model: Cosmos-Transfer2.5-2B

# Each command runs inside .venv. Use {python}, {request}, and {result}; the
# first token resolves to data_preparation.python. The worker
# writes a result JSON containing records_path equal to output_records. Keep the
# stage order: sam3 -> transfer -> simulator -> planner -> predict.
# The exact upstream SAM3/Cosmos CLI is release-dependent, so these commands
# are deployment configuration rather than hard-coded Python imports.
execution:
  stages: []
  # Example worker entry (replace the module/arguments with the pinned upstream
  # release command):
  # stages:
  #   - name: sam3
  #     input_records: dataset/mi_reward/instance_rollouts/initial_requests.jsonl
  #     output_records: dataset/mi_reward/instance_rollouts/sam3_records.jsonl
  #     command: ["{python}", "-m", "your_sam3_worker", "--request", "{request}", "--result", "{result}"]

features:
  extractor: lawam_lam
  lam_config_path: .venv/models/lawam_lam/dino_large_vae.yaml
  lam_ckpt_path: .venv/models/lawam_lam/checkpoints/pytorch_model.pt
  dino_checkpoint_root: .venv/models/dinov3-vitb16-pretrain-lvd1689m

training:
  relation_weight: 1.0
  hidden_dim: 256
  num_heads: 8
  batch_size: 16
  epochs: 20
  lr: 0.0001
