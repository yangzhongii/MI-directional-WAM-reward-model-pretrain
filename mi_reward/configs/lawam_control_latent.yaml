# Pipeline v6 / Test 1: frozen-LaWAM action-conditioned next-latent prediction.
# This configuration intentionally has no MI, reward, or privileged geometry loss.
representation:
  backbone: frozen_lawam_visual_tokens
  view: wrist
  control_dim: 64
  preserve_spatial_tokens: true
  projector: layernorm_row_normalized_linear

dynamics:
  action_coordinate: actual_eef_displacement_xyz
  action_dim: 3
  action_scale_m: 0.003
  hidden_dim: 64
  form: tokenwise_state_conditioned_residual
  zero_action_identity: true

training:
  loss:
    next_latent_l1: 1.0
    delta_latent_l1: 1.0
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  batch_size: 8
  epochs: 100
  seed: 20260909

split:
  train_demos: [3, 6, 7, 8, 9, 11, 12, 13]
  validation_demos: [14, 15]
  frozen_test_demos: [1, 2, 4, 5, 10]
