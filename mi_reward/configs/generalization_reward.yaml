# Generalization data and reward-training configuration.
# Stage 1 generates scene/instance variants and verified rollouts.
# Stage 2 extracts features, builds directional preferences, and trains SFT.
task_suite: rigid_v1
task_family: pick_place
task_families: [pick_place, push_shape, peg_insertion]

data_preparation:
  environment_root: .venv
  python: .venv/bin/python
  headless: true
  mujoco:
    backend: mujoco
    gl_backend: egl
    asset_catalog_version: rigid_v1
  sam3:
    source_root: .venv/src/sam3
    checkpoint_root: .venv/models/sam3
  cosmos:
    predict_source_root: .venv/src/cosmos-predict2.5
    transfer_source_root: .venv/src/cosmos-transfer2.5
    predict_checkpoint_root: .venv/models/cosmos-predict2.5
    transfer_checkpoint_root: .venv/models/cosmos-transfer2.5
    transfer_depth_checkpoint: .venv/models/cosmos-transfer2.5/general/depth/626e6618-bfcd-4d9a-a077-1409e2ce353f_ema_bf16.pt
    predict_model: 2B/robot/action-cond
    transfer_model: Cosmos-Transfer2.5-2B

paths:
  candidate_records: dataset/mi_reward/generalization_rollouts/rigid_v1_records.jsonl
  manifest: dataset/mi_reward/manifests/generalization_rigid_v1.jsonl
  success_refs: dataset/mi_reward/manifests/generalization_rigid_v1_success_refs.jsonl
  feature_root: dataset/mi_reward/generalization_features/rigid_v1
  preferences: dataset/mi_reward/generalization_preferences/rigid_v1.jsonl
  output_dir: results/mi_reward/generalization_rigid_v1
  feasibility_config: mi_reward/configs/feasibility_rigid.json
  run_report: results/mi_reward/generalization_rigid_v1/run_report.json

verification:
  max_pose_step: 0.25
  require_controls: true

generation:
  num_candidates: 8
  predict_model: 2B/robot/action-cond
  transfer_model: Cosmos-Transfer2.5-2B

# Workers are data-generation components. Configure release-specific commands
# for SAM3, scene transfer, MuJoCo, planning, and Predict in this section.
# The fixed order is: sam3 -> simulator -> planner -> predict -> transfer.
# Each worker receives {request}/{result} and writes records_path in its result.
execution:
  stages:
    # Add configured sam3/simulator/planner/predict workers before this entry
    # when those stages are not produced by an external base-rollout job.
    - name: transfer
      input_records: dataset/mi_reward/generalization_rollouts/predict_records.jsonl
      output_records: dataset/mi_reward/generalization_rollouts/rigid_v1_records.jsonl
      command:
        - "{python}"
        - "-m"
        - "mi_reward.data.cosmos_transfer_worker"
        - "--request"
        - "{request}"
        - "--result"
        - "{result}"
        - "--transfer-repo"
        - ".venv/src/cosmos-transfer2.5"
        - "--variants"
        - "mi_reward/configs/scene_variants.yaml"
        - "--num-gpus"
        - "2"
        - "--checkpoint-path"
        - ".venv/models/cosmos-transfer2.5/general/depth/626e6618-bfcd-4d9a-a077-1409e2ce353f_ema_bf16.pt"

features:
  extractor: lawam_lam
  lam_config_path: .venv/models/lawam_lam/dino_large_vae.yaml
  lam_ckpt_path: .venv/models/lawam_lam/checkpoints/pytorch_model.pt
  dino_checkpoint_root: .venv/models/dinov3-vitb16-pretrain-lvd1689m

training:
  relation_weight: 1.0
  hidden_dim: 256
  num_heads: 8
  batch_size: 16
  epochs: 20
  lr: 0.0001
  gamma: 0.99
  mi_backend: dame_bspline
  lambda_rank: 1.0
  lambda_potential: 1.0
  lambda_direction: 0.5
  directional_alignment: true
  directional_w_endpoint: 1.0
  directional_w_positive: 0.5
  directional_w_regression: 1.0
  directional_w_stage: 1.0
  directional_w_alignment: 0.1
