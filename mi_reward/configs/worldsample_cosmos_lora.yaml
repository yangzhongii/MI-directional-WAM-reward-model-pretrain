version: 1
model:
  size: 2B
  experiment: ac_reason_embeddings_rectified_flow_2b_256_320
  checkpoint: .venv/models/cosmos-predict2.5/robot/action-cond/38c6c645-7d41-4560-8eeb-6f4ddc0e6574_ema_bf16.pt
  lora_rank: 32
  lora_alpha: 32
  lora_target_modules: q_proj,k_proj,v_proj,output_proj,mlp.layer1,mlp.layer2

dataset:
  root: logs/mi_reward/worldsample/libero_spatial/task-00/cosmos_dataset
  camera_ids: [0, 1]
  resolution: [256, 320]
  num_action_per_chunk: 12
  # LIBERO demonstrations are recorded at 20 Hz; the public Bridge action
  # model reports 4 fps, so sample every fifth frame.
  fps_downsample_ratio: 5

training:
  batch_size_per_gpu: 1
  max_iter: 1000
  save_iter: 200
  validation_iter: 200
  learning_rate: 0.0001
  output_root: logs/mi_reward/worldsample/cosmos_lora_runs

distributed:
  master_addr: 172.16.0.6
  master_port: 29500
  interface: auto
  remote_host: zhonghaoyang@172.16.0.3
  remote_root: /mnt/public/zhonghaoyang/MI-directional-WAM-reward-model-pretrain
