task_family: pick_place
instruction: pick up the banana and place it in the basket
source_object: apple
target_object: banana
goal_container: basket
scene_variants: [table_light_1, table_dark_2]
object_variants: [apple_train, banana_heldout]
camera: global_cam
num_candidates: 8
planner: lawam_or_motion_plan
simulator: mujoco
predict_model: 2B/robot/action-cond
transfer_enabled: true
asset_catalog_version: rigid_v1
simulation:
  model_path: assets/custom_task/scene/scene.xml
  initial_keyframe: home
  camera_name: global_cam
  mocap_body_name: ee_target
  ee_body_name: panda_hand
  task_object_body_name: task_object
  goal_body_name: basket
  gripper_actuator_name: gripper
  preserve_body_names: [panda, table, task_object, basket]
  object_geom_names: [task_object_geom]
  gripper_geom_names: [left_finger_geom, right_finger_geom]
  forbidden_geom_names: [table_geom, wall_geom]
  require_contact_phases: [grasp, close, lift, transport, place]
  goal_distance_threshold: 0.06
planner:
  steps_per_segment: 4
  hover_height: 0.10
  gripper_open: 1.0
  gripper_closed: 0.0
  candidate_jitter_xy: 0.01
instances:
  - variant_id: apple_train
    source_category: apple
    target_category: apple
    asset_uri: builtin://pick_place/apple
    task_role: task_object
  - variant_id: banana_heldout
    source_category: apple
    target_category: banana
    asset_uri: builtin://pick_place/banana
    model_path: assets/custom_task/scene/scene_banana.xml
    task_role: task_object
