task_family: peg_insertion
instruction: align the peg and insert it into the matching hole
source_object: peg_round
target_object: peg_square
scene_variants:
  - variant_id: table_light_1
    split: train
    prompt: clean light-gray laboratory table with soft daylight
    seed: 2025
  - variant_id: table_dark_2
    split: heldout
    prompt: dark charcoal industrial workbench with soft overhead lighting
    seed: 2026
object_variants: [round_train, square_heldout]
camera: global_cam
num_candidates: 8
planner: lawam_or_motion_plan
simulator: mujoco
predict_model: 2B/robot/action-cond
transfer_enabled: false
asset_catalog_version: rigid_v1
simulation:
  model_path: assets/custom_task/scene/scene_peg_round.xml
  initial_keyframe: home
  camera_name: global_cam
  mocap_body_name: ee_target
  ee_body_name: panda_hand
  task_object_body_name: task_object
  goal_body_name: insertion_hole
  gripper_actuator_name: gripper
  hide_full_robot: true
  kinematic_task_proxy: true
  preserve_body_names: [table, task_object, insertion_hole]
  object_geom_names: [task_object_geom, task_object_geom_aux1, task_object_geom_aux2, task_object_geom_aux3, task_object_geom_aux4]
  gripper_geom_names: [left_finger_geom, right_finger_geom]
  forbidden_geom_names: [table_geom, wall_geom]
  require_contact_phases: [grasp, close, lift, transport, align, insert]
  goal_distance_threshold: 0.04
  goal_orientation_threshold: 0.35
planner:
  steps_per_segment: 4
  hover_height: 0.10
  insertion_depth: 0.03
  gripper_open: 1.0
  gripper_closed: 0.0
  candidate_jitter_xy: 0.005
  initial_object_jitter_xy: 0.03
  candidate_profiles:
    - direct_success
    - detour_success
    - delayed_success
    - undershoot
    - overshoot
    - wrong_direction
    - failed_grasp
    - regress_after_progress
instances:
  - variant_id: round_train
    split: train
    source_category: peg_round
    target_category: peg_round
    asset_uri: builtin://peg_insertion/peg_round
    scene_model_paths:
      table_light_1: assets/custom_task/scene/scene_peg_round_table_light_1.xml
      table_dark_2: assets/custom_task/scene/scene_peg_round_table_dark_2.xml
    task_role: task_object
  - variant_id: square_heldout
    split: heldout
    source_category: peg_round
    target_category: peg_square
    asset_uri: builtin://peg_insertion/peg_square
    model_path: assets/custom_task/scene/scene_peg_square.xml
    scene_model_paths:
      table_light_1: assets/custom_task/scene/scene_peg_square_table_light_1.xml
      table_dark_2: assets/custom_task/scene/scene_peg_square_table_dark_2.xml
    task_role: task_object
