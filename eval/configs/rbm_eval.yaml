# RBM-EVAL configuration for MI/LaWAM reward checkpoints.
# Paths are relative to the repository root unless absolute.
robometer:
  source_root: .venv/src/robometer
  processed_datasets: .venv/datasets/robometer

paths:
  checkpoint: results/mi_reward/reward_head_mvp/pytorch_model.pt
  output_dir: results/rbm_eval/mi_reward

model:
  # auto reads checkpoint.config.model_class. Supported without sidecars:
  # StatePotentialRewardModel and TrajectoryRewardHead.
  type: auto
  device: cuda
  precision: fp32
  preference_aggregation: last  # last | mean | sum | delta

features:
  # Use lawam_lam for GeoProgress checkpoints and fill the three local paths below.
  extractor: dino_v3
  model_path: .venv/models/dinov3-vitb16-pretrain-lvd1689m
  lam_config_path: .venv/models/lawam_lam/dino_large_vae.yaml
  lam_ckpt_path: .venv/models/lawam_lam/checkpoints/pytorch_model.pt
  vision_model_id: .venv/models/dinov3-vitb16-pretrain-lvd1689m
  image_size: 224
  batch_size: 8
  strict: true

# GeoProgressPotential additionally needs an explicit sidecar. Each JSONL row
# must contain trajectory_id, relations ([[T, relation_dim]]), and either
# goal_frames ([path, ...]) or goal_tokens_path ([K, visual_dim] torch tensor).
geoprogress:
  relation_sidecar: null

benchmark:
  eval_types: [reward_alignment, policy_ranking, quality_preference]
  datasets:
    reward_alignment: [rbm-1m-ood]
    policy_ranking: [rbm-1m-ood]
    quality_preference: [rbm-1m-ood]
  max_frames: 16
  min_frames_per_trajectory: 2
  use_frame_steps: false
  reward_alignment_max_trajectories: 50
  policy_ranking_max_tasks: 100
  num_examples_per_quality_pr: 5
  comparisons_per_task: null
  max_comparisons: 1000
  random_seed: 42
  pad_frames: false

runtime:
  save_raw_results: true
